<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21182b">
<title>STRONG — Bodybuilding Coach</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f7f3fa;color:#292131;margin:0}header{background:#24172f;color:#fff;padding:26px 20px}header h1{margin:0;font-size:33px}header p{color:#dbcae5;margin-bottom:0}.wrap{max-width:650px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:17px;margin-bottom:14px;box-shadow:0 2px 12px #36203914}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.days button{border:0;border-radius:9px;padding:11px 2px;background:#f1e7f5;color:#382542}.days button.on{background:#7c4292;color:#fff}.btn{background:#7c4292;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:bold}.light{background:#eee3f3;color:#59326b}.nav{display:flex;gap:8px;margin-top:13px}.nav button{flex:1}h2{margin:0 0 12px}h3{margin:5px 0}.muted{color:#776a80;font-size:13px}.exercise{border-bottom:1px solid #eae2ee;padding:15px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.set{display:grid;grid-template-columns:45px 1fr 1fr 36px;gap:8px;align-items:center;margin:9px 0}.set input{width:100%;min-width:0;padding:9px;border:1px solid #d8cddd;border-radius:8px;font-size:16px}.set input[type=checkbox]{width:25px;height:25px;accent-color:#7c4292}.tabs{display:flex;position:sticky;top:0;background:white;z-index:3}.tabs button{flex:1;padding:14px 5px;background:white;border:0;font-weight:bold;color:#664a74}.tabs button.on{border-bottom:3px solid #7c4292}.hide{display:none}label{font-size:13px}.field{display:block;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #d8cddd;border-radius:9px;font-size:16px}
</style>
</head>
<body>
<header><h1>STRONG ✦</h1><p>My Bodybuilding Coach · 5'4" · 144 lb</p></header>
<div class="tabs"><button onclick="tab('train',this)" class="on">Workouts</button><button onclick="tab('history',this)">History</button><button onclick="tab('body',this)">Body Stats</button></div>
<div class="wrap">
<section id="train"><div class="card"><h2 id="title"></h2><p id="focus" class="muted"></p><div id="days" class="days"></div><div class="nav"><button class="btn light" onclick="move(-1)">‹ Previous</button><button class="btn light" onclick="move(1)">Next ›</button></div></div><div id="exercises" class="card"></div><div class="card"><p id="progress"></p><button class="btn" onclick="finish()" style="width:100%">Save Completed Workout</button></div></section>
<section id="history" class="hide"><h2>Workout History</h2><div id="past"></div></section>
<section id="body" class="hide"><h2>Body Measurements</h2><div class="card"><label>Weight (lb)<input class="field" id="weight" type="number" step=".1"></label><label>Waist (in)<input class="field" id="waist" type="number" step=".1"></label><label>Glutes/Hips (in)<input class="field" id="hips" type="number" step=".1"></label><label>Thigh (in)<input class="field" id="thigh" type="number" step=".1"></label><label>Arm (in)<input class="field" id="arm" type="number" step=".1"></label><button class="btn" onclick="measure()">Save Measurements</button></div><div id="measurements"></div></section>
</div>
<script>
const plan=[
['Back + Biceps + Abs','Build a muscular back, arms and abs',[['Lat pulldown',3,'8-12'],['Seated cable row',3,'8-12'],['Landmine row',2,'10/arm'],['Rear delt cable fly',2,'12-15'],['Pro Maxima biceps curl',3,'10-12'],['Hammer curls',2,'10-12'],['Cable crunch',3,'12-15'],['Reverse crunch',2,'12-15']]],
['Glutes + Hamstrings','Build round glutes and thick hamstrings',[['Romanian deadlift',3,'8-10'],['Barbell hip thrust',3,'8-12'],['Reverse lunges',2,'10/leg'],['Cable hamstring curl',2,'12/leg'],['Cable kickbacks',2,'12-15/leg'],['Calf raises',3,'12-15']]],
['Active Recovery','Gentle walking and mobility',[]],
['Shoulders + Chest + Triceps','Build rounded shoulders and defined arms',[['Dumbbell shoulder press',3,'8-10'],['Cable lateral raise',3,'12-15'],['Incline bench press',3,'8-12'],['Rear delt fly',2,'12-15'],['Triceps pushdown',3,'10-12'],['Overhead triceps extension',2,'10-12']]],
['Quads + Glutes','Build thick quads and full glutes',[['Smith or barbell squat',3,'8-10'],['Barbell hip thrust',3,'10'],['Bulgarian split squat',2,'8-10/leg'],['Landmine squat',2,'10-12'],['Cable hip abduction',2,'15/leg'],['Calf raises',2,'12-15']]],
['Back + Arms + Abs','More upper body and core definition',[['Lat pulldown',3,'10-12'],['Chest-supported row',3,'10-12'],['Pro Maxima biceps curl',2,'12'],['Triceps pushdown',2,'12'],['Cable crunch',3,'12-15'],['Hanging knee raises',3,'10-15']]],
['Full Rest','Rest, recover, eat and sleep',[]]];
const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let d=(new Date().getDay()+6)%7;
let db=JSON.parse(localStorage.getItem('strong_data')||'{"sets":{},"history":[],"measurements":[]}');
function save(){localStorage.setItem('strong_data',JSON.stringify(db))}
function move(n){d=(d+n+7)%7;render()}
function render(){
document.getElementById('title').textContent=names[d]+' — '+plan[d][0];
document.getElementById('focus').textContent=plan[d][1];
document.getElementById('days').innerHTML=names.map((n,i)=>'<button class="'+(i===d?'on':'')+'" onclick="d='+i+';render()">'+n+'</button>').join('');
let h='';
plan[d][2].forEach((e,i)=>{
h+='<div class="exercise"><div class="line"><div><h3>'+e[0]+'</h3><span class="muted">'+e[1]+' sets × '+e[2]+' reps</span></div><button class="btn light" onclick="demo('+i+')">▶ Demo</button></div>';
for(let j=0;j<e[1];j++){
let k=d+'-'+i+'-'+j,v=db.sets[k]||{};
h+='<div class="set"><label>Set '+(j+1)+'</label><input placeholder="lb" type="number" value="'+(v.lb||'')+'" onchange="update(\''+k+'\',\'lb\',this.value)"><input placeholder="reps" type="number" value="'+(v.reps||'')+'" onchange="update(\''+k+'\',\'reps\',this.value)"><input type="checkbox" '+(v.done?'checked':'')+' onchange="update(\''+k+'\',\'done\',this.checked)"></div>';
}h+='</div>';
});
document.getElementById('exercises').innerHTML=h||'<p>Recovery day — no lifting required.</p>';
progress();}
function update(k,f,v){if(!db.sets[k])db.sets[k]={};db.sets[k][f]=v;save();progress()}
function progress(){let total=0,done=0;plan[d][2].forEach((e,i)=>{for(let j=0;j<e[1];j++){total++;if(db.sets[d+'-'+i+'-'+j]?.done)done++}});document.getElementById('progress').textContent=done+' of '+total+' sets completed'}
function demo(i){let q=encodeURIComponent(plan[d][2][i][0]+' proper exercise form demonstration');window.open('https://www.youtube.com/results?search_query='+q,'_blank')}
function finish(){let rows=[];plan[d][2].forEach((e,i)=>{for(let j=0;j<e[1];j++){let v=db.sets[d+'-'+i+'-'+j];if(v?.done)rows.push(e[0]+': '+(v.lb||'?')+' lb × '+(v.reps||'?')+' reps')}});if(!rows.length){alert('Check off your completed sets first');return}db.history.unshift({date:new Date().toLocaleString(),title:plan[d][0],rows});save();showHistory();alert('Workout saved!')}
function showHistory(){document.getElementById('past').innerHTML=db.history.map(x=>'<div class="card"><h3>'+x.title+'</h3><p class="muted">'+x.date+'</p><p>'+x.rows.join('<br>')+'</p></div>').join('')||'No workouts recorded yet'}
function measure(){let v={date:new Date().toLocaleDateString()};['weight','waist','hips','thigh','arm'].forEach(x=>v[x]=document.getElementById(x).value);db.measurements.unshift(v);save();showMeasures();alert('Measurements saved!')}
function showMeasures(){document.getElementById('measurements').innerHTML=db.measurements.map(x=>'<div class="card"><b>'+x.date+'</b><p>Weight: '+x.weight+' lb · Waist: '+x.waist+' in · Hips: '+x.hips+' in · Thigh: '+x.thigh+' in · Arm: '+x.arm+' in</p></div>').join('')}
function tab(id,btn){document.querySelectorAll('section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');if(id==='history')showHistory();if(id==='body')showMeasures()}
let sx=0;document.getElementById('train').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.getElementById('train').addEventListener('touchend',e=>{let delta=e.changedTouches[0].clientX-sx;if(Math.abs(delta)>100)move(delta<0?1:-1)},{passive:true});
render();
</script></body></html>
